# Copy to .github/workflows/llm-fuzz-ci.yml and edit the lines marked EDIT ME.
# Everything else has a working default.
#
# Two jobs, on purpose. The agent runs unsandboxed, so it could edit your code
# or your installed packages. `test` starts on a fresh runner from a clean
# checkout and takes only the generated inputs, so whatever the agent did to its
# own machine cannot change the verdict on its own work.

name: LLM Fuzz CI

on:
  # Run it by hand from the Actions tab while you are setting it up.
  workflow_dispatch:

  # Once it works, uncomment one of these.
  # schedule:
  #   - cron: "17 2 * * *"   # nightly at 02:17 UTC
  # pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # EDIT ME — set your project up however you normally do. Poetry, uv, a
      # Makefile, extra services: anything works. The agent needs pytest to be
      # able to import your code, same as a normal test run.
      - run: pip install -e .

      - uses: NDV-tiime/llm-fuzz-ci/actions/generate@v1
        with:
          # EDIT ME — where your @pytest.mark.llm_fuzz tests live.
          test-paths: tests

          # codex (default) or claude. Leave model unset for the agent default.
          agent: codex
          # model: gpt-5.6-terra

          # Match the key to the agent:
          #   codex  -> openai-api-key, or openrouter-api-key with provider: openrouter
          #   claude -> anthropic-api-key
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

  test:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # only needed when create-issue is true

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # EDIT ME — the same setup as above. This job never runs an agent; it only
      # replays the inputs the agent wrote.
      - run: pip install -e .

      - uses: NDV-tiime/llm-fuzz-ci@v1
        with:
          # EDIT ME — must match test-paths in the generate job.
          test-paths: tests

          # Open an issue when a generated input fails a marked test.
          create-issue: true

          # Set to false to report failures without failing the workflow.
          hard-fail: true
