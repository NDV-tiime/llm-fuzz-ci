name: LLM Fuzz CI

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

jobs:
  generate-fuzz-cases:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: llm-fuzz/llm-fuzz-ci/actions/generate@v1
        with:
          test-paths: tests
          setup-command: |
            python -m pip install -U pip
            python -m pip install -r requirements.txt
            python -m pip install -e .
          pythonpath: src
          agent: codex
          model: gpt-5.6-terra
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          show-usage: "true"
          usage-report: .llm-fuzz/reports/llm-usage.json

      - name: Show generated inputs
        run: |
          llm-fuzz-ci cases \
            --corpus-dir .llm-fuzz/cases \
            --output .llm-fuzz/reports/generated-inputs.md
          cat .llm-fuzz/reports/generated-inputs.md
          cat .llm-fuzz/reports/generated-inputs.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: llm-fuzz-cases
          path: |
            .llm-fuzz/targets.json
            .llm-fuzz/cases
            .llm-fuzz/reports
          if-no-files-found: error

  test-fuzz-cases:
    needs: generate-fuzz-cases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: llm-fuzz-cases
          path: .

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: llm-fuzz/llm-fuzz-ci/actions/setup@v1

      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Test fuzz cases
        id: test_fuzz_cases
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          llm-fuzz-ci test-fuzz-cases \
            --corpus-dir .llm-fuzz/cases \
            --report .llm-fuzz/reports/test-report.json \
            --require-cases \
            -- tests -q

      - name: Show test report
        if: always()
        run: |
          if [ ! -f .llm-fuzz/reports/test-report.json ]; then
            echo "No LLM Fuzz CI test report was produced."
            exit 0
          fi
          llm-fuzz-ci report \
            --report .llm-fuzz/reports/test-report.json \
            --format markdown \
            --all \
            --show-failure-details \
            --output .llm-fuzz/reports/test-report.md
          cat .llm-fuzz/reports/test-report.md
          cat .llm-fuzz/reports/test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Write full report artifact
        if: always()
        run: |
          llm-fuzz-ci summary \
            --corpus-dir .llm-fuzz/cases \
            --report .llm-fuzz/reports/test-report.json \
            --usage-report .llm-fuzz/reports/llm-usage.json \
            --output .llm-fuzz/reports/llm-fuzz-ci-report.md

      - name: Analyze test report
        id: test_report
        if: always()
        run: |
          if [ ! -f .llm-fuzz/reports/test-report.json ]; then
            echo "failed_cases=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json
          import os

          report = json.load(open(".llm-fuzz/reports/test-report.json"))
          failed = int(report.get("summary", {}).get("failed_cases", 0))
          print(f"Failed generated inputs: {failed}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"failed_cases={failed}\n")
          PY

      - name: Create GitHub issue
        if: steps.test_report.outputs.failed_cases != '0'
        uses: actions/github-script@v9
        env:
          REPORT_PATH: .llm-fuzz/reports/test-report.md
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'LLM Fuzz CI detected a vulnerability',
              body
            });

      - name: Fail workflow
        if: steps.test_fuzz_cases.outcome == 'failure'
        run: exit 1
