name: Report LLM Fuzz Results
description: Render the run, upload it, open an issue on failure, and fail the job.

inputs:
  working-directory:
    description: Repository subdirectory the run happened in.
    required: false
    default: "."
  create-issue:
    description: Open a GitHub issue when a generated input fails.
    required: false
    default: "false"
  github-token:
    description: Token used to open the issue. Needs issues:write.
    required: false
    default: ${{ github.token }}
  issue-assignees:
    description: >-
      Comma-separated logins to assign the issue to. GitHub emails an assignee,
      so this is how a failing run reaches someone who is not watching the repo.
    required: false
    default: ""
  issue-labels:
    description: Comma-separated labels to put on the issue.
    required: false
    default: ""
  hard-fail:
    description: Fail the job when a generated input fails.
    required: false
    default: "true"

outputs:
  failed-inputs:
    description: How many generated inputs failed their marked test.
    value: ${{ steps.counts.outputs.failed }}

runs:
  using: composite
  steps:
    - name: Show test results
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        llm-fuzz-ci summary --format overview \
          --corpus-dir .llm-fuzz/cases \
          --report .llm-fuzz/reports/test-report.json \
          --usage-report .llm-fuzz/reports/llm-usage.json \
          --output .llm-fuzz/reports/overview.md
        cat .llm-fuzz/reports/overview.md
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          cat .llm-fuzz/reports/overview.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Write the full report
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        llm-fuzz-ci summary \
          --corpus-dir .llm-fuzz/cases \
          --report .llm-fuzz/reports/test-report.json \
          --usage-report .llm-fuzz/reports/llm-usage.json \
          --output .llm-fuzz/reports/llm-fuzz-ci-report.md

    - name: Count failures
      id: counts
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import json, pathlib

        path = pathlib.Path(".llm-fuzz/reports/test-report.json")
        summary = json.loads(path.read_text())["summary"] if path.exists() else {}
        print(f"failed={summary.get('failed_cases', 0)}")
        print(f"executed={summary.get('executed_cases', 0)}")
        PY

    - uses: actions/upload-artifact@v7
      with:
        name: llm-fuzz-ci-report
        path: ${{ inputs.working-directory }}/.llm-fuzz/reports
        if-no-files-found: ignore

    - name: Open an issue
      if: ${{ inputs.create-issue == 'true' && steps.counts.outputs.failed != '0' }}
      uses: actions/github-script@v9
      env:
        ASSIGNEES: ${{ inputs.issue-assignees }}
        LABELS: ${{ inputs.issue-labels }}
        FAILED: ${{ steps.counts.outputs.failed }}
        OVERVIEW: ${{ inputs.working-directory }}/.llm-fuzz/reports/overview.md
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const { owner, repo } = context.repo;
          const list = (value) =>
            (value || '').split(',').map((s) => s.trim()).filter(Boolean);

          const run =
            `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
          const body = [
            fs.readFileSync(process.env.OVERVIEW, 'utf8'),
            '',
            `[Run #${context.runNumber}](${run}) - commit \`${context.sha.slice(0, 7)}\``,
          ].join('\n');

          const created = await github.rest.issues.create({
            owner, repo,
            title: `LLM Fuzz CI: ${process.env.FAILED} generated input(s) failing`,
            body,
            assignees: list(process.env.ASSIGNEES),
            labels: list(process.env.LABELS),
          });
          core.notice(
            `${process.env.FAILED} failing input(s); opened issue #${created.data.number}`
          );

    - name: Fail the job
      if: ${{ inputs.hard-fail == 'true' && steps.counts.outputs.failed != '0' }}
      shell: bash
      run: |
        echo "${{ steps.counts.outputs.failed }} generated input(s) failed a marked test."
        exit 1
