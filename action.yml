name: LLM Fuzz CI
description: Run agent-generated adversarial inputs against your pytest assertions and report.
author: NDV-tiime

branding:
  icon: shield
  color: purple

inputs:
  test-paths:
    description: Space-separated pytest paths holding your marked tests.
    required: false
    default: tests
  runner:
    description: "Test framework: pytest, vitest, or auto to pick from the paths."
    required: false
    default: auto
  working-directory:
    description: Repository subdirectory the run happens in.
    required: false
    default: "."
  create-issue:
    description: Open a GitHub issue when a generated input fails.
    required: false
    default: "false"
  github-token:
    description: Token used to open the issue. Needs issues:write.
    required: false
    default: ${{ github.token }}
  issue-assignees:
    description: >-
      Comma-separated logins to assign the issue to. GitHub emails an assignee,
      so this is how a failing run reaches someone who is not watching the repo.
    required: false
    default: ""
  issue-labels:
    description: Comma-separated labels to put on the issue.
    required: false
    default: ""
  hard-fail:
    description: Fail the job when a generated input fails.
    required: false
    default: "true"

outputs:
  failed-inputs:
    description: How many generated inputs failed their marked test.
    value: ${{ steps.report.outputs.failed-inputs }}

runs:
  using: composite
  steps:
    # This job never runs an agent. It starts from a clean checkout of your
    # code and takes only the generated inputs from the job that did, so
    # nothing the agent touched can reach the run that judges its work.
    - name: Install LLM Fuzz CI
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"

    - name: Fetch the generated inputs
      uses: actions/download-artifact@v7
      with:
        name: llm-fuzz-ci-cases
        path: ${{ inputs.working-directory }}/.llm-fuzz

    - name: Run the generated inputs
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      run: >-
        llm-fuzz-ci test-fuzz-cases --require-cases
        --runner "${{ inputs.runner }}" -- ${{ inputs.test-paths }}

    - id: report
      uses: NDV-tiime/llm-fuzz-ci/actions/report@v1
      if: always()
      with:
        working-directory: ${{ inputs.working-directory }}
        create-issue: ${{ inputs.create-issue }}
        github-token: ${{ inputs.github-token }}
        issue-assignees: ${{ inputs.issue-assignees }}
        issue-labels: ${{ inputs.issue-labels }}
        hard-fail: ${{ inputs.hard-fail }}
