name: LLM Fuzz CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Repository subdirectory where collection, generation, and testing run.
        required: false
        type: string
        default: "."
      test-paths:
        description: Space-separated pytest paths to collect and test.
        required: false
        type: string
        default: tests
      setup-command:
        description: Shell command that installs the caller repository's test dependencies.
        required: false
        type: string
        default: ""
      pythonpath:
        description: Optional PYTHONPATH for src-layout or un-packaged Python repositories.
        required: false
        type: string
        default: ""
      python-version:
        description: Python version for collect and test jobs.
        required: false
        type: string
        default: "3.12"
      agent:
        description: "Fuzz case generator to use: codex or claude."
        required: false
        type: string
        default: codex
      model:
        description: Optional model passed to the selected coding agent.
        required: false
        type: string
        default: ""
      provider:
        description: Optional Codex model provider id. Use openrouter for the built-in OpenRouter shortcut.
        required: false
        type: string
        default: ""
      max-budget-usd:
        description: Optional override for each target's required marker budget. Claude Code receives it as a hard per-target budget.
        required: false
        type: string
        default: ""
      timeout-seconds:
        description: Maximum generation time per target.
        required: false
        type: string
        default: "600"
      show-usage:
        description: Print total LLM token usage after generation.
        required: false
        type: boolean
        default: false
      create-issue:
        description: Create a GitHub issue when generated inputs fail marked tests.
        required: false
        type: boolean
        default: false
      hard-fail:
        description: Fail the workflow when generated inputs fail marked tests.
        required: false
        type: boolean
        default: true
    secrets:
      OPENAI_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false

jobs:
  generate-fuzz-cases:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - uses: NDV-tiime/llm-fuzz-ci/actions/generate@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          test-paths: ${{ inputs.test-paths }}
          setup-command: ${{ inputs.setup-command }}
          pythonpath: ${{ inputs.pythonpath }}
          agent: ${{ inputs.agent }}
          model: ${{ inputs.model }}
          provider: ${{ inputs.provider }}
          max-budget-usd: ${{ inputs.max-budget-usd }}
          timeout-seconds: ${{ inputs.timeout-seconds }}
          show-usage: ${{ inputs.show-usage }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - uses: actions/upload-artifact@v7
        with:
          name: llm-fuzz-cases
          path: |
            ${{ inputs.working-directory }}/.llm-fuzz/targets.json
            ${{ inputs.working-directory }}/.llm-fuzz/cases
            ${{ inputs.working-directory }}/.llm-fuzz/reports
          if-no-files-found: error

  test-fuzz-cases:
    needs: generate-fuzz-cases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: llm-fuzz-cases
          path: ${{ inputs.working-directory }}/.llm-fuzz

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - uses: NDV-tiime/llm-fuzz-ci/actions/setup@v1

      - name: Install test dependencies
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          LLM_FUZZ_PYTHONPATH: ${{ inputs.pythonpath }}
        run: |
          set -euo pipefail
          if [ -n "$LLM_FUZZ_PYTHONPATH" ]; then
            export PYTHONPATH="$LLM_FUZZ_PYTHONPATH${PYTHONPATH:+:$PYTHONPATH}"
          fi
          if [ -n "${{ inputs.setup-command }}" ]; then
            ${{ inputs.setup-command }}
          fi

      - name: Test fuzz cases
        id: test_fuzz_cases
        continue-on-error: true
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          LLM_FUZZ_PYTHONPATH: ${{ inputs.pythonpath }}
        run: |
          set -euo pipefail
          if [ -n "$LLM_FUZZ_PYTHONPATH" ]; then
            export PYTHONPATH="$LLM_FUZZ_PYTHONPATH${PYTHONPATH:+:$PYTHONPATH}"
          fi
          llm-fuzz-ci test-fuzz-cases \
            --corpus-dir .llm-fuzz/cases \
            --report .llm-fuzz/reports/test-report.json \
            --require-cases \
            -- ${{ inputs.test-paths }}

      - uses: NDV-tiime/llm-fuzz-ci/actions/report@v1
        if: always()
        with:
          working-directory: ${{ inputs.working-directory }}
          create-issue: ${{ inputs.create-issue }}
          github-token: ${{ github.token }}
          hard-fail: ${{ inputs.hard-fail }}
