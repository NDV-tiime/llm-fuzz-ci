[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-fuzz-ci"
version = "0.1.0"
description = "CI-oriented LLM fuzz case generation and testing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pytest>=8",
]

[project.scripts]
llm-fuzz-ci = "llm_fuzz_ci.cli:main"

[project.entry-points.pytest11]
llm_fuzz_ci = "llm_fuzz_ci.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_fuzz_ci = ["prompts/*.md"]
